name: Build & Test PixxxelBoard Fork

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build & Test Fork
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x pixelboard-patches/gradlew

      - name: Run Patch & ABI Verification Tests
        run: |
          cd pixelboard-patches
          ./gradlew :patches:test --info

      - name: Run PixxxelBoard Extension Unit Tests
        run: |
          cd pixelboard-patches
          ./gradlew :extensions:extension:testDebugUnitTest \
            --tests "com.akshaykadam.pixelboard.extension.settings.GboardCommaSpacingSettingsTest" \
            --tests "com.akshaykadam.pixelboard.extension.settings.GboardQuickPasteSettingsTest" \
            --tests "com.akshaykadam.pixelboard.extension.keyboard.GboardCommaSpacingRuntimeTest" \
            --tests "com.akshaykadam.pixelboard.extension.clipboard.GboardQuickPasteRuntimeTest" \
            --tests "com.akshaykadam.pixelboard.extension.settings.GboardSettingsTextTest" \
            --tests "com.akshaykadam.pixelboard.extension.settings.GboardPatchesSettingsActivityToggleSourceTest" \
            --tests "com.akshaykadam.pixelboard.extension.settings.GboardPatchesSettingsActivitySourceTest"

      - name: Build Android Patch Bundle (.mpp)
        run: |
          cd pixelboard-patches
          ./gradlew :patches:buildAndroid

      - name: Upload Compiled Patch Bundle
        uses: actions/upload-artifact@v4
        with:
          name: pixxxelboard-patches-bundle
          path: pixelboard-patches/patches/build/libs/*.mpp
